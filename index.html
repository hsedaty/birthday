<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kuromi 8-Bit Birthday</title>
  <!-- Import 8-bit font -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      min-height: 560px;
      background: #f7a9d2;
      image-rendering: pixelated;
      font-family: 'Press Start 2P', cursive;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .kuromi-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      opacity: 0.34;
      pointer-events: none;
    }

    .background-row {
      flex: 0 0 180px;
      width: 100%;
      background-repeat: repeat-x;
      background-position: center;
      background-size: auto 100%;
    }

    #confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
    }

    /* Center the email icon */
    .email-container {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      width: 100vw;
      height: 100vh;
      z-index: 10;
    }

    /* Email Icon */
    #email {
      width: 364px;
      height: 364px;
      transform: translate(0, 50px);
      background: url("mail-unopened.png") no-repeat center/contain;
      image-rendering: pixelated;
      cursor: pointer;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Notification badge centered on the icon */
    #email:not(.opened)::after {
      content: "1";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(20px, -50px);
      background: red;
      color: white;
      font-size: 12px;
      padding: 12px 12px;
      border-radius: 50%;
      border: 3px solid black;
      font-family: 'Press Start 2P', cursive;
      box-shadow: 2px 2px 0 #000;
      z-index: 2;
      pointer-events: none;
    }

    #email.opened {
      pointer-events: none;
      background: url("mail-opened.png") no-repeat center/contain;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    /* Polaroid style */
    .polaroid {
      position: absolute;
      width: min(64vw, 300px);
      aspect-ratio: 5 / 6;
      background: white;
      border: 4px solid black;
      padding: 5px;
      box-shadow: 4px 4px 0 black;
      transform: translateX(0) scale(0.78) rotate(var(--angle, 0deg));
      opacity: 0;
      transition: transform 0.38s cubic-bezier(.2,.8,.2,1), opacity 0.28s ease;
      image-rendering: pixelated;
      z-index: 5;
      pointer-events: none;
    }

    .polaroid > img:not(.signature) {
      width: 100%;
      height: calc(100% - 22px);
      object-fit: cover;
      image-rendering: pixelated;
      -webkit-user-drag: none;
      user-select: none;
    }

    .polaroid .signature {
      position: absolute;
      right: 9px;
      bottom: 9px;
      width: 58px;
      height: 58px;
      object-fit: contain;
      object-position: right bottom;
      image-rendering: pixelated;
      filter: drop-shadow(2px 2px 0 #fff);
      pointer-events: none;
      -webkit-user-drag: none;
      user-select: none;
    }

    .polaroid.active {
      transform: translateX(0) scale(1) rotate(var(--angle, 0deg));
      opacity: 1;
      z-index: 6;
    }

    .birthday-text {
      position: fixed;
      bottom: 24px;
      left: 0;
      width: 100vw;
      text-align: center;
      font-family: 'Press Start 2P', cursive;
      font-size: 2.1rem;
      color: #fff;
      text-shadow: 4px 4px 0 #fa5fde, 10px 10px 0 #000;
      letter-spacing: 0;
      line-height: 1.2;
      z-index: 50;
      user-select: none;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.6s cubic-bezier(.68,-0.55,.27,1.55), transform 0.6s cubic-bezier(.68,-0.55,.27,1.55);
    }
    .birthday-text.show {
      opacity: 1;
      transform: scale(1);
    }

    /* Centered, single-card carousel */
    .carousel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
      width: min(96vw, 560px);
      height: min(64vh, 390px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease;
      touch-action: pan-y;
    }

    .carousel.show {
      opacity: 1;
      visibility: visible;
    }

    .carousel-track {
      position: relative;
      width: min(64vw, 310px);
      height: min(76.8vw, 372px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .carousel-button,
    .reroll-button {
      border: 3px solid #000;
      background: #ff69b4;
      color: #fff;
      box-shadow: 4px 4px 0 #000;
      font-family: 'Press Start 2P', cursive;
      cursor: pointer;
    }

    .carousel-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      padding: 0;
      font-size: 24px;
      z-index: 10;
    }

    .carousel-button:active,
    .reroll-button:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 #000;
    }

    .carousel-button:active {
      transform: translateY(-50%) translate(3px, 3px);
    }

    .previous-card { left: 0; }
    .next-card { right: 0; }

    .carousel-status {
      position: absolute;
      bottom: -38px;
      color: #fff;
      font-size: 11px;
      text-shadow: 2px 2px 0 #000;
    }

    .reroll-button {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 210;
      padding: 14px 18px;
      font-size: 11px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease;
    }

    .reroll-button.show {
      opacity: 1;
      visibility: visible;
    }

    .top-kuromi {
      position: fixed;
      top: -34px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      opacity: 0;
      transition: opacity 0.8s cubic-bezier(.68,-0.55,.27,1.55);
      pointer-events: none;
      width: 190px;
      height: auto;
      image-rendering: pixelated;
    }
    .top-kuromi.show {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .background-row {
        flex-basis: 120px;
      }

      .top-kuromi {
        width: 210px;
        top: 8px;
      }

      .carousel {
        top: 48%;
        height: 58vh;
      }

      .carousel-track {
        width: 88vw;
        height: 105.6vw;
      }

      .polaroid,
      .polaroid.active {
        width: 82vw;
        max-width: 350px;
        transform: translateX(0) scale(1) rotate(clamp(-7deg, var(--angle, 0deg), 7deg));
      }

      .polaroid .signature {
        width: 70px;
        height: 70px;
      }

      .carousel-button {
        display: none;
      }

      .carousel-status {
        top: calc(50% + min(49.2vw, 210px) + 14px);
        bottom: auto;
      }

      .birthday-text {
        top: calc(48% + min(49.2vw, 210px) + 32px);
        bottom: auto;
        padding: 0 16px;
        box-sizing: border-box;
        font-size: 1.45rem;
        line-height: 1.4;
        text-shadow: 3px 3px 0 #ff69b4, 6px 6px 0 #000;
      }

      .reroll-button {
        top: 18px;
        right: 14px;
        bottom: auto;
        padding: 12px;
        font-size: 9px;
      }
    }
  </style>
</head>
<body>
  <div class="kuromi-background" aria-hidden="true"></div>
  <canvas id="confetti"></canvas>
  <!-- Kuromi image at the top, hidden initially -->
  <img src="kuromimain.png" alt="Kuromi" class="top-kuromi" id="top-kuromi">

  <!-- Centered Email Icon -->
  <div class="email-container">
    <div id="email"></div>
  </div>

  <!-- Add more .polaroid elements here; the carousel has no card limit. -->
  <div class="carousel" id="carousel" aria-label="Birthday photo cards">
    <button class="carousel-button previous-card" type="button" aria-label="Previous photo card">&lt;</button>
    <div class="carousel-track">
      <div class="polaroid" style="--angle:-15deg;">
        <img src="IMG_2918.JPG" alt="Polaroid 1">
      </div>
      <div class="polaroid" style="--angle:-7deg;">
        <img src="IMG_4436.JPG" alt="Polaroid 2">
      </div>
      <div class="polaroid" style="--angle:0deg;">
        <img src="IMG_4439.JPG" alt="Polaroid 3">
      </div>
      <div class="polaroid" style="--angle:7deg;">
        <img src="IMG_4443.JPG" alt="Polaroid 4">
      </div>
      <div class="polaroid" style="--angle:12deg;">
        <img src="IMG_4548.JPG" alt="Polaroid 5">
      </div>
      <div class="polaroid" style="--angle:18deg;">
        <img src="IMG_4662.jpg" alt="Polaroid 6">
      </div>
      <div class="polaroid" style="--angle:-15deg;">
        <img src="IMG_4688.jpg" alt="Polaroid 7">
      </div>
      <div class="polaroid" style="--angle:-7deg;">
        <img src="IMG_4706.JPG" alt="Polaroid 8">
      </div>
      <div class="polaroid" style="--angle:0deg;">
        <img src="IMG_4919.JPG" alt="Polaroid 9">
      </div>
      <div class="polaroid" style="--angle:7deg;">
        <img src="IMG_4930.JPG" alt="Polaroid 10">
      </div>
      <div class="polaroid" style="--angle:12deg;">
        <img src="IMG_4992.JPG" alt="Polaroid 11">
      </div>
    </div>
    <button class="carousel-button next-card" type="button" aria-label="Next photo card">&gt;</button>
    <div class="carousel-status" aria-live="polite"></div>
  </div>

  <button class="reroll-button" type="button">REROLL</button>
  <div class="birthday-text">HAPPY BIRTHDAY NADA!!!</div>

  <script>
    const background = document.querySelector('.kuromi-background');
    const backgroundImages = ['bg1.jpeg', 'bg2.jpeg', 'bg3.jpeg'];

    function buildBackground() {
      const rowHeight = window.innerWidth <= 600 ? 120 : 180;
      const rowCount = Math.ceil(window.innerHeight / rowHeight) + 1;
      background.replaceChildren();

      for (let index = 0; index < rowCount; index++) {
        const row = document.createElement('div');
        row.className = 'background-row';
        row.style.backgroundImage = `url("${backgroundImages[index % backgroundImages.length]}")`;
        background.appendChild(row);
      }
    }

    buildBackground();

    // Confetti animation
    const confettiCanvas = document.getElementById('confetti');
    const ctx = confettiCanvas.getContext('2d');
    let confettiParticles = [];

    function resizeCanvas() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function randomColor() {
      const colors = ['#ff69b4', '#fff', '#f00', '#ff0', '#0ff', '#0f0', '#00f', '#f0f'];
      return colors[Math.floor(Math.random() * colors.length)];
    }

    function createConfetti() {
      for (let i = 0; i < 150; i++) {
        confettiParticles.push({
          x: Math.random() * confettiCanvas.width,
          y: Math.random() * -confettiCanvas.height,
          r: 6 + Math.random() * 8,
          d: Math.random() * 150,
          color: randomColor(),
          tilt: Math.random() * 10 - 10,
          tiltAngleIncremental: (Math.random() * 0.07) + .05,
          tiltAngle: 0
        });
      }
    }

    function drawConfetti() {
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      confettiParticles.forEach(p => {
        ctx.beginPath();
        ctx.lineWidth = p.r;
        ctx.strokeStyle = p.color;
        ctx.moveTo(p.x + p.tilt + (p.r / 3), p.y);
        ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
        ctx.stroke();
      });
      updateConfetti();
    }

    function updateConfetti() {
      confettiParticles.forEach(p => {
        p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
        p.x += Math.sin(0.01 * p.d);
        p.tiltAngle += p.tiltAngleIncremental;
        p.tilt = Math.sin(p.tiltAngle) * 15;

        if (p.y > confettiCanvas.height) {
          p.x = Math.random() * confettiCanvas.width;
          p.y = -10;
        }
      });
    }

    let confettiActive = false;
    function startConfetti() {
      if (confettiActive) return;
      confettiActive = true;
      createConfetti();
      let frame = 0;
      function animate() {
        drawConfetti();
        frame++;
        if (frame < 480) { // 8 seconds at 60fps (was 180 for 3 seconds)
          requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
          confettiParticles = [];
          confettiActive = false;
        }
      }
      animate();
    }

    // Photo card carousel
    const email = document.getElementById("email");
    const carousel = document.getElementById("carousel");
    const carouselTrack = carousel.querySelector(".carousel-track");
    const previousButton = carousel.querySelector(".previous-card");
    const nextButton = carousel.querySelector(".next-card");
    const carouselStatus = carousel.querySelector(".carousel-status");
    const rerollButton = document.querySelector(".reroll-button");
    const polaroids = Array.from(carousel.querySelectorAll(".polaroid"));
    const birthdayText = document.querySelector('.birthday-text');
    const topKuromi = document.getElementById('top-kuromi');
    let opened = false;
    let currentCard = 0;
    let touchStartX = 0;

    polaroids.forEach((polaroid, index) => {
      const signature = document.createElement("img");
      signature.className = "signature";
      signature.src = index % 2 === 0 ? "lemon.png" : "mintlemonade.png";
      signature.alt = "";
      signature.setAttribute("aria-hidden", "true");
      polaroid.appendChild(signature);
    });

    function showCard(index) {
      currentCard = (index + polaroids.length) % polaroids.length;
      polaroids.forEach((polaroid, cardIndex) => {
        polaroid.classList.toggle("active", cardIndex === currentCard);
      });
      carouselStatus.textContent = `${currentCard + 1} / ${polaroids.length}`;
    }

    function shuffleCards() {
      for (let index = polaroids.length - 1; index > 0; index--) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [polaroids[index], polaroids[randomIndex]] = [polaroids[randomIndex], polaroids[index]];
      }
      polaroids.forEach(polaroid => carouselTrack.appendChild(polaroid));
      showCard(0);
    }

    function moveCard(direction) {
      showCard(currentCard + direction);
    }

    previousButton.addEventListener("click", () => moveCard(-1));
    nextButton.addEventListener("click", () => moveCard(1));

    carousel.addEventListener("touchstart", event => {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });

    carousel.addEventListener("touchend", event => {
      const swipeDistance = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(swipeDistance) < 45) return;
      moveCard(swipeDistance < 0 ? 1 : -1);
    }, { passive: true });

    document.addEventListener("keydown", event => {
      if (!opened) return;
      if (event.key === "ArrowLeft") moveCard(-1);
      if (event.key === "ArrowRight") moveCard(1);
    });

    rerollButton.addEventListener("click", () => {
      shuffleCards();
      startConfetti();
    });

    email.addEventListener("click", () => {
      if (opened) return;
      opened = true;

      // Simulate email "open" with a shake
      email.animate(
        [{ transform: "scale(1)" },
         { transform: "scale(1.2)" },
         { transform: "scale(1)" }],
        { duration: 500 }
      );

      // Remove notification badge
      email.classList.add("opened");

      shuffleCards();
      setTimeout(() => {
        carousel.classList.add("show");
        rerollButton.classList.add("show");
        birthdayText.classList.add("show");
        topKuromi.classList.add("show");
      }, 400);

      // Start confetti
      startConfetti();
    });

    window.addEventListener('resize', buildBackground);
  </script>
</body>
</html>
